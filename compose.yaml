services:
  myverse:
    image: myverse-commerce:local
    build:
      context: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MYVERSE_HTTP_PORT:-8080}:10000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "10000"
      DATABASE_PATH: /var/data/commerce.sqlite
      PUBLIC_APP_URL: "${PUBLIC_APP_URL:-}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: gpt-4.1-mini
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_CONNECT_CLIENT_ID: "${STRIPE_CONNECT_CLIENT_ID:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      SHIPPING_COUNTRIES: "${SHIPPING_COUNTRIES:-US}"
      STRIPE_AUTOMATIC_TAX: "${STRIPE_AUTOMATIC_TAX:-false}"
      DEMO_PASSWORD: "${DEMO_PASSWORD:-}"
    volumes:
      - myverse-data:/var/data
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:10000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  myverse-data:
